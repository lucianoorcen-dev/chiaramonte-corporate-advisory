<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Ualá Bis TEST</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      color: #222;
    }

    button {
      background: #111;
      color: white;
      border: 0;
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    pre {
      margin-top: 25px;
      padding: 15px;
      background: #f4f4f4;
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>Prueba Ualá Bis TEST</h1>

  <p>
    Esta página crea una orden de prueba por
    <strong>ARS $100</strong>.
  </p>

  <button id="crearOrden">
    Crear orden TEST
  </button>

  <pre id="resultado">Esperando...</pre>

  <script>
    const boton = document.getElementById("crearOrden");
    const resultado = document.getElementById("resultado");

    boton.addEventListener("click", async () => {
      boton.disabled = true;
      resultado.textContent = "Creando orden...";

      try {
        const response = await fetch(
          "/api/ualabis/create-test-order",
          {
            method: "POST"
          }
        );

        const data = await response.json();

        resultado.textContent =
          JSON.stringify(data, null, 2);

      } catch (error) {
        resultado.textContent =
          "Error: " + error.message;
      } finally {
        boton.disabled = false;
      }
    });
  </script>

</body>
</html>
